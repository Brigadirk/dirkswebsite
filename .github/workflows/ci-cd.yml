name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-staging
          path: dist/
      
      - name: Deploy to Vercel (Staging)
        id: deploy
        run: |
          echo "Staging deployment ready"
          echo "url=https://staging.dirkswebsite.vercel.app" >> $GITHUB_OUTPUT
        # To enable Vercel deployment, uncomment below and add secrets:
        # - Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to GitHub secrets
        # - Install Vercel CLI: npm i -g vercel
        # - Run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        # - Run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        # - Run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-main
          path: dist/
      
      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          echo "Production deployment ready"
          echo "url=https://dirkswebsite.vercel.app" >> $GITHUB_OUTPUT
        # To enable Vercel deployment, uncomment below and add secrets:
        # - Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to GitHub secrets
        # - Install Vercel CLI: npm i -g vercel
        # - Run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        # - Run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        # - Run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
